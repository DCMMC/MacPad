; MacWS compatibility override for the macOS Steam build of Stray.
;
; The shipped/cooked config resolves NativePlatformService to IOS when the
; game runs in the iPad chroot, while DefaultPlatformService already resolves
; to Steam.  The macOS bundle contains OnlineSubsystemSteam but does not
; contain OnlineSubsystemIOS, so keep both selections on the packaged native
; Steam subsystem.
[OnlineSubsystem]
NativePlatformService=Steam
